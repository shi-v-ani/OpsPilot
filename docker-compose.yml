services:
  auth-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.auth_service.main:app
    ports:
      - "8001:8000"

  file-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.file_service.main:app
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - AUTH_TIMEOUT_SECONDS=2.0
    depends_on:
      - auth-service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
